<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TAP Admin</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{font-family:system-ui,Arial,sans-serif;color:#172033;background:#f4f6fa}*{box-sizing:border-box}body{margin:0;padding:24px}.wrap{max-width:1050px;margin:auto}h1{margin-top:0}.panel{background:white;border:1px solid #dce2ec;border-radius:14px;padding:20px;margin:16px 0}form{display:grid;gap:12px;max-width:420px}input,button,select{font:inherit;padding:12px;border:1px solid #cbd3df;border-radius:8px}button{background:#1769e8;color:white;border:0;font-weight:700;cursor:pointer}button:disabled{opacity:.6}table{width:100%;border-collapse:collapse;background:white}th,td{text-align:left;padding:11px;border-bottom:1px solid #e5e9f0;vertical-align:top}th{background:#f7f9fc} .tablewrap{overflow:auto}.muted{color:#647084}#status{min-height:24px}.hidden{display:none}.actions{display:flex;gap:8px;align-items:center} .actions select{padding:7px} @media(max-width:600px){body{padding:12px}th,td{padding:8px;font-size:13px}}
</style></head><body><main class="wrap"><h1>TAP – Orders dashboard</h1><p class="muted">Private administration area</p>
<section class="panel" id="loginPanel"><h2>Admin login</h2><form id="loginForm"><input id="email" type="email" placeholder="Admin email" required autocomplete="username"><input id="password" type="password" placeholder="Password" required autocomplete="current-password"><button>Sign in</button></form><p id="loginMsg"></p></section>
<section class="panel hidden" id="ordersPanel"><div style="display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap"><h2>Orders</h2><div class="actions"><button id="refresh">Refresh</button><button id="logout">Sign out</button></div></div><p id="status" class="muted"></p><div class="tablewrap"><table><thead><tr><th>Date</th><th>Customer</th><th>Phone</th><th>City</th><th>Pack</th><th>Business / review link</th><th>Status</th></tr></thead><tbody id="orders"></tbody></table></div></section>
</main><script>
const SUPABASE_URL='https://vqpzwbtlcyyrozveyatg.supabase.co';
const SUPABASE_KEY='sb_publishable_B-kUK-lqzAcLKdwhLxU6cg_jv_xsKMC';
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);
function showSession(session){$('loginPanel').classList.toggle('hidden',!!session);$('ordersPanel').classList.toggle('hidden',!session);if(session)loadOrders();}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();$('loginMsg').textContent='Signing in…';const {error}=await db.auth.signInWithPassword({email:$('email').value,password:$('password').value});$('loginMsg').textContent=error?error.message:'';if(!error)showSession(true);});
async function loadOrders(){ $('status').textContent='Loading…';const {data,error}=await db.from('orders').select('*').order('created_at',{ascending:false});if(error){$('status').textContent='Error: '+error.message;return;} $('status').textContent=data.length+' order(s)';$('orders').replaceChildren();for(const o of data){const tr=document.createElement('tr');const vals=[new Date(o.created_at).toLocaleString(),o.customer_name,o.phone,o.city,o.pack,o.business_name+(o.review_link?' · '+o.review_link:'')];for(const v of vals){const td=document.createElement('td');td.textContent=v||'—';tr.append(td);}const td=document.createElement('td');const sel=document.createElement('select');['new','confirmed','shipped','completed','cancelled'].forEach(s=>{const op=document.createElement('option');op.value=s;op.textContent=s;sel.append(op)});sel.value=o.status;sel.addEventListener('change',async()=>{sel.disabled=true;const {error}=await db.from('orders').update({status:sel.value}).eq('id',o.id);sel.disabled=false;if(error){alert('Could not update status: '+error.message);sel.value=o.status;}else{o.status=sel.value;}});td.append(sel);tr.append(td);$('orders').append(tr);}}
$('refresh').addEventListener('click',loadOrders);$('logout').addEventListener('click',async()=>{await db.auth.signOut();showSession(false);});
db.auth.getSession().then(({data})=>showSession(data.session));db.auth.onAuthStateChange((_event,session)=>showSession(session));
</script></body></html>
